name: Swifty

options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "15.0"
  defaultConfig: Debug

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: $(inherited) DEBUG=1
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  DiscordCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DiscordCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vivescene.Swifty.DiscordCore
        PRODUCT_NAME: DiscordCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  AuthFeature:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AuthFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vivescene.Swifty.AuthFeature
        PRODUCT_NAME: AuthFeature
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  CacheCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CacheCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vivescene.Swifty.CacheCore
        PRODUCT_NAME: CacheCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  RemoteAuthTransport:
    type: framework
    platform: macOS
    sources:
      - path: Sources/RemoteAuthTransport
    dependencies:
      - sdk: CryptoKit.framework
      - sdk: Foundation.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vivescene.Swifty.RemoteAuthTransport
        PRODUCT_NAME: RemoteAuthTransport
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  Swifty:
    type: application
    platform: macOS
    sources:
      - path: Sources/SwiftyApp
    dependencies:
      - target: DiscordCore
      - target: AuthFeature
      - target: CacheCore
      - target: RemoteAuthTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vivescene.Swifty
        PRODUCT_NAME: Swifty
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Swifty
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: YES

  SwiftyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DiscordCore
      - target: AuthFeature
      - target: CacheCore
      - target: RemoteAuthTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vivescene.Swifty.Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  Swifty:
    build:
      targets:
        Swifty: all
    run:
      config: Debug
      executable: Swifty
      askForAppToLaunch: false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: SwiftyTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
